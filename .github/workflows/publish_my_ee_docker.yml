name: Publish My Chatwoot Enterprise docker images

permissions:
  contents: read
  packages: write

on:
  # Only build on manual trigger or tags/releases
  # Comment out the push trigger to avoid automatic builds on every commit
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
  # Build on tags (e.g., v1.0.0)
  push:
    tags:
      - 'v*'

env:
  GITHUB_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      # Guards the two ways a release has silently lost fork content:
      #  - branching an upgrade off `main` when `main` is not what production runs
      #    (that is how the Sidebar Kanban removal nearly went missing in Sept 2026), and
      #  - an upstream merge quietly reverting a customization.
      # Fail the build here rather than ship an image that looks fine and behaves wrong.
      - name: Verify fork customizations and edition
        run: |
          fail=0
          check() {  # check <description> <file> <grep-args...>
            desc="$1"; file="$2"; shift 2
            if grep -q "$@" "$file"; then
              echo "OK   $desc"
            else
              echo "MISS $desc  ($file)"; fail=1
            fi
          }

          check "OPERATOR_TYPES_7 is defined" \
            app/javascript/dashboard/routes/dashboard/settings/automation/operators.js \
            -- 'export const OPERATOR_TYPES_7'
          check "text custom attributes map to OPERATOR_TYPES_7" \
            app/javascript/dashboard/helper/automationHelper.js \
            -- 'text: OPERATOR_TYPES_7'
          check "custom attributes resolve in create mode too" \
            app/javascript/dashboard/helper/automationHelper.js \
            -- 'Check for custom attributes in both edit and create modes'

          # Inverse check: upstream ships a native Kanban sidebar entry, this fork removes it.
          if grep -qi kanban app/javascript/dashboard/components-next/sidebar/Sidebar.vue; then
            echo "MISS native Kanban entry is back in Sidebar.vue"; fail=1
          else
            echo "OK   native Kanban entry stays removed"
          fi

          # ChatwootApp.enterprise? is `root.join('enterprise').exist?` - a CE build is one
          # where enterprise/ was deleted. Assert the directory, not CW_EDITION.
          if [ -d enterprise ]; then
            echo "OK   enterprise/ present ($(find enterprise -type f | wc -l) files)"
          else
            echo "MISS enterprise/ is absent - this would build a CE image"; fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "::error::fork customization check failed - refusing to publish"; exit 1; }

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DOCKER_TAG=${GITHUB_REPO}:main-ee" >> $GITHUB_ENV
            echo "DOCKER_TAG_LATEST=${GITHUB_REPO}:latest-ee" >> $GITHUB_ENV
          else
            # If tag already ends with -ee, don't append another -ee
            # Use case-insensitive check and handle both -ee and -EE
            if echo "$SANITIZED_REF" | grep -qE '(-ee|-EE)$'; then
              FINAL_TAG="${SANITIZED_REF}"
            else
              FINAL_TAG="${SANITIZED_REF}-ee"
            fi
            echo "DOCKER_TAG=${GITHUB_REPO}:${FINAL_TAG}" >> $GITHUB_ENV
            echo "DOCKER_TAG_LATEST=" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        id: build-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_TAG_LATEST }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:main-ee \
              -t ghcr.io/${{ github.repository }}:latest-ee \
              $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          else
            SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
            # If tag already ends with -ee, don't append another -ee
            if echo "$SANITIZED_REF" | grep -qE '(-ee|-EE)$'; then
              FINAL_TAG="${SANITIZED_REF}"
            else
              FINAL_TAG="${SANITIZED_REF}-ee"
            fi
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:${FINAL_TAG} \
              $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          fi

      - name: Inspect image
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            REPO="ghcr.io/${{ github.repository }}"
            docker buildx imagetools inspect ${REPO}:main-ee
            docker buildx imagetools inspect ${REPO}:latest-ee
          else
            SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
            # If tag already ends with -ee, don't append another -ee
            if echo "$SANITIZED_REF" | grep -qE '(-ee|-EE)$'; then
              FINAL_TAG="${SANITIZED_REF}"
            else
              FINAL_TAG="${SANITIZED_REF}-ee"
            fi
            REPO="ghcr.io/${{ github.repository }}"
            docker buildx imagetools inspect ${REPO}:${FINAL_TAG}
          fi

